<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カタン ランダム盤面</title>
<meta name="theme-color" content="#4F8FBF">
<meta name="description" content="カタン（3〜4人用）の地形・数字・港をランダムに並べた盤面を、画面いっぱいに表示します。">
<style>
  :root {
    --surface: #FAFAF8;
    --on-surface: #1A1A1A;
    --muted: #6B6B6B;
    --primary: #2F6F6A;
    --border: #E5E5E0;
    --radius-md: 0.75rem;
    --shadow-card: 0 1px 4px rgba(40, 60, 60, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: var(--surface);
    color: var(--on-surface);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    flex: 1;
    min-height: 0;
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left));
    background: #4F8FBF; /* 海 */
  }
  #board { width: 100%; height: 100%; display: block; }
  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }
  .bar h1 {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar button {
    min-height: 44px;
    padding: 0 20px;
    border: 0;
    border-radius: var(--radius-md);
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    box-shadow: var(--shadow-card);
    cursor: pointer;
    touch-action: manipulation; /* 連打でダブルタップ拡大にならないように */
  }
  .bar button:active { transform: translateY(1px); }
  /* スマホ横向き: 高さが足りないのでボタンを右側の縦帯に移す */
  @media (orientation: landscape) and (max-height: 500px) {
    body { flex-direction: row; }
    main { padding-bottom: max(8px, env(safe-area-inset-bottom)); padding-right: 8px; }
    .bar {
      flex-direction: column;
      justify-content: flex-end;
      border-top: 0;
      border-left: 1px solid var(--border);
      padding: 12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) 12px;
    }
    .bar h1 { display: none; }
  }
</style>
</head>
<body>
<main>
  <svg id="board" role="img" aria-label="カタンの盤面"></svg>
</main>
<div class="bar">
  <h1>カタン ランダム盤面</h1>
  <button id="regen" type="button">新しい盤面</button>
</div>

<script>
'use strict';

const S = 100; // 六角形1枚の外接半径（SVG 座標）
const SVG_NS = 'http://www.w3.org/2000/svg';

const TERRAIN = {
  wood:   { name: '木',     fill: '#3F7A3A', ink: '#fff' },
  brick:  { name: 'レンガ', fill: '#B85C38', ink: '#fff' },
  sheep:  { name: '羊',     fill: '#9CC56B', ink: '#1A1A1A' },
  wheat:  { name: '小麦',   fill: '#E2BC48', ink: '#1A1A1A' },
  ore:    { name: '石',     fill: '#8C9196', ink: '#fff' },
  desert: { name: '砂漠',   fill: '#E3D5AE', ink: '#1A1A1A' },
};
const TILES = [
  'wood', 'wood', 'wood', 'wood',
  'brick', 'brick', 'brick',
  'sheep', 'sheep', 'sheep', 'sheep',
  'wheat', 'wheat', 'wheat', 'wheat',
  'ore', 'ore', 'ore',
  'desert',
];
const NUMBERS = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];
// 枠パーツ6枚。1枚が海岸線5辺ぶんで、[何番目の辺(0始まり・時計回り), 港の種類]
const FRAMES = [
  [[0, 'any'], [3, 'wheat']],
  [[0, 'any'], [3, 'brick']],
  [[0, 'any'], [3, 'sheep']],
  [[2, 'ore']],
  [[2, 'wood']],
  [[2, 'any']],
];

// 尖頂（pointy-top）六角形。辺 i の向こう側の隣接マス（axial 座標の差分）
const DIRS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];

const HEXES = [];
for (let r = -2; r <= 2; r++) {
  for (let q = -2; q <= 2; q++) {
    if (Math.abs(q + r) <= 2) HEXES.push({ q, r });
  }
}
const onBoard = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)) <= 2;
const center = ({ q, r }) => [S * Math.sqrt(3) * (q + r / 2), S * 1.5 * r];
const corner = ([cx, cy], i) => {
  const a = Math.PI / 180 * (60 * i - 30);
  return [cx + S * Math.cos(a), cy + S * Math.sin(a)];
};

// 外周の辺を盤面の周りに沿った順に並べる（盤面は中心から星形なので角度順で一周する）
const COAST = [];
HEXES.forEach((h) => {
  const c = center(h);
  DIRS.forEach(([dq, dr], i) => {
    if (onBoard(h.q + dq, h.r + dr)) return;
    const a = corner(c, i);
    const b = corner(c, (i + 1) % 6);
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    COAST.push({ a, b, mid, c, q: h.q, r: h.r, i, angle: Math.atan2(mid[1], mid[0]) });
  });
});
COAST.sort((x, y) => x.angle - y.angle); // 画面上で時計回り
// 枠の6辺。上辺の枠は左上角のマスの左上の辺から始まり、そこから5辺ずつ時計回りに並ぶ
const TOP = COAST.findIndex((e) => e.q === 0 && e.r === -2 && e.i === 4);
const SLOTS = [];
for (let k = 0; k < 6; k++) {
  SLOTS.push([0, 1, 2, 3, 4].map((j) => COAST[(TOP + 5 * k + j) % COAST.length]));
}

function randomInt(n) {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return buf[0] % n;
}
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randomInt(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generate() {
  const terrains = shuffle(TILES);
  const numbers = shuffle(NUMBERS);
  let n = 0;
  return {
    tiles: HEXES.map((h, i) => ({
      ...h,
      terrain: terrains[i],
      number: terrains[i] === 'desert' ? null : numbers[n++],
    })),
    frames: shuffle(FRAMES),
  };
}

function el(name, attrs, parent) {
  const e = document.createElementNS(SVG_NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function text(parent, x, y, str, attrs) {
  const t = el('text', { x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', ...attrs }, parent);
  t.textContent = str;
  return t;
}
const pts = (list) => list.map((p) => p.join(',')).join(' ');
const pips = (n) => 6 - Math.abs(7 - n);

// 文字・チップの大きさ（S 倍）。スマホ表示は盤面が小さく映るぶん文字とチップを大きくする
const SIZES = {
  normal: {
    label: 0.19, labelY: -0.6,
    chipR: 0.38, chipY: 0.05, num: 0.34, numY: -0.02, pipY: 0.24, pipR: 0.035, pipGap: 0.1,
    robber: 1,
    portR: 0.36, portDist: 0.62, ratio: 0.2, ratioY: -0.09, portName: 0.15, portNameY: 0.14, any: 0.22,
  },
  compact: {
    label: 0.3, labelY: -0.6,
    chipR: 0.44, chipY: 0.14, num: 0.44, numY: 0.07, pipY: 0.4, pipR: 0.05, pipGap: 0.12,
    robber: 1.25,
    portR: 0.48, portDist: 0.68, ratio: 0.2, ratioY: 0.21, portName: 0.25, portNameY: -0.06, any: 0.3,
  },
};

const svg = document.getElementById('board');
let state = generate();

function render() {
  // 縦長の画面では盤面を90度回して大きく見せる（文字は回さない）
  const rotate = svg.clientHeight > svg.clientWidth;
  const P = ([x, y]) => (rotate ? [-y, x] : [x, y]);
  const compact = Math.min(svg.clientWidth, svg.clientHeight) < 600;
  const Z = compact ? SIZES.compact : SIZES.normal;
  svg.dataset.compact = compact ? '1' : '0';

  svg.replaceChildren();
  svg.setAttribute('font-family', 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif');

  // 枠パーツの継ぎ目（各パーツの左端の頂点から外へ）
  SLOTS.forEach((slot) => {
    const v = slot[0].a;
    const len = Math.hypot(v[0], v[1]);
    const [x1, y1] = P(v);
    const [x2, y2] = P([v[0] / len * (len + 0.55 * S), v[1] / len * (len + 0.55 * S)]);
    el('line', { class: 'seam', x1, y1, x2, y2, stroke: 'rgba(255,255,255,0.45)', 'stroke-width': 0.04 * S, 'stroke-dasharray': `${0.1 * S} ${0.08 * S}` }, svg);
  });

  // 港（桟橋2本＋札）
  const ports = [];
  state.frames.forEach((frame, k) => frame.forEach(([j, type]) => ports.push({ e: SLOTS[k][j], type, slot: k, edge: j })));
  ports.forEach(({ e, type, slot, edge }) => {
    const nx = e.mid[0] - e.c[0];
    const ny = e.mid[1] - e.c[1];
    const len = Math.hypot(nx, ny);
    const pos = P([e.mid[0] + nx / len * Z.portDist * S, e.mid[1] + ny / len * Z.portDist * S]);
    const g = el('g', { class: 'port', 'data-port': type, 'data-slot': slot, 'data-edge': edge }, svg);
    [e.a, e.b].forEach((v) => {
      const [x, y] = P(v);
      el('line', { x1: pos[0], y1: pos[1], x2: x, y2: y, stroke: '#7A5C3A', 'stroke-width': 0.07 * S, 'stroke-linecap': 'round' }, g);
    });
    const t = TERRAIN[type];
    el('circle', { cx: pos[0], cy: pos[1], r: Z.portR * S, fill: t ? t.fill : '#F5EDD6', stroke: '#FAFAF8', 'stroke-width': 0.05 * S }, g);
    const ink = t ? t.ink : '#1A1A1A';
    if (t) {
      text(g, pos[0], pos[1] + Z.ratioY * S, '2:1', { 'font-size': Z.ratio * S, 'font-weight': 700, fill: ink });
      text(g, pos[0], pos[1] + Z.portNameY * S, t.name, { 'font-size': Z.portName * S, 'font-weight': 700, fill: ink, class: 'port-name' });
    } else {
      text(g, pos[0], pos[1], '3:1', { 'font-size': Z.any * S, 'font-weight': 700, fill: ink });
    }
  });

  // 地形タイル・数字チップ・盗賊
  state.tiles.forEach((tile) => {
    const t = TERRAIN[tile.terrain];
    const c = center(tile);
    const [x, y] = P(c);
    const g = el('g', { class: 'tile', 'data-terrain': tile.terrain, 'data-number': tile.number ?? '' }, svg);
    const hex = [];
    for (let i = 0; i < 6; i++) hex.push(P(corner(c, i)));
    el('polygon', { points: pts(hex), fill: t.fill, stroke: '#F3E6C4', 'stroke-width': 0.07 * S, 'stroke-linejoin': 'round' }, g);
    text(g, x, y + Z.labelY * S, t.name, { 'font-size': Z.label * S, 'font-weight': 700, fill: t.ink, class: 'label' });

    if (tile.number == null) {
      // 盗賊
      const k = Z.robber * S;
      el('circle', { cx: x, cy: y - 0.2 * k, r: 0.13 * k, fill: '#3A3A3A' }, g);
      el('path', {
        d: `M ${x - 0.2 * k} ${y + 0.32 * k} Q ${x - 0.2 * k} ${y - 0.1 * k} ${x} ${y - 0.1 * k} Q ${x + 0.2 * k} ${y - 0.1 * k} ${x + 0.2 * k} ${y + 0.32 * k} Z`,
        fill: '#3A3A3A',
      }, g);
      return;
    }
    const hot = tile.number === 6 || tile.number === 8;
    const ink = hot ? '#B3261E' : '#1A1A1A';
    el('circle', { cx: x, cy: y + Z.chipY * S, r: Z.chipR * S, fill: '#F5EDD6', stroke: 'rgba(0,0,0,0.15)', 'stroke-width': 0.03 * S }, g);
    text(g, x, y + Z.numY * S, String(tile.number), { 'font-size': Z.num * S, 'font-weight': 700, fill: ink, class: 'num' });
    const n = pips(tile.number);
    for (let i = 0; i < n; i++) {
      el('circle', { cx: x + (i - (n - 1) / 2) * Z.pipGap * S, cy: y + Z.pipY * S, r: Z.pipR * S, fill: ink }, g);
    }
  });

  // 陸地と港がちょうど収まる範囲まで拡大する（周りは背景の海）
  const box = svg.getBBox();
  const m = 0.15 * S;
  svg.setAttribute('viewBox', `${box.x - m} ${box.y - m} ${box.width + 2 * m} ${box.height + 2 * m}`);
}

document.getElementById('regen').addEventListener('click', () => {
  state = generate();
  render();
});
new ResizeObserver(render).observe(svg);
render();
</script>
</body>
</html>
